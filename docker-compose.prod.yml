name: typekittools-prod

services:
  # 1. Next.js App Service
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: typekittools:latest
    container_name: typekit_web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-typekit_admin}:${POSTGRES_PASSWORD:-ChangeMeSecurePassword2026!}@db:5432/${POSTGRES_DB:-typekit_db}?schema=public
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://typekittools.com}
      - NEXT_PUBLIC_SITE_NAME=TypeKitTools
      - NEXT_PUBLIC_ENABLE_ADS=${NEXT_PUBLIC_ENABLE_ADS:-true}
      - NEXT_PUBLIC_ADSENSE_CLIENT_ID=${NEXT_PUBLIC_ADSENSE_CLIENT_ID}
      - NEXT_PUBLIC_GA_MEASUREMENT_ID=${NEXT_PUBLIC_GA_MEASUREMENT_ID}
      - ADMIN_SECRET_KEY=${ADMIN_SECRET_KEY:-typekit-tools-production-secret-min-32-chars!}
      - ADMIN_SESSION_COOKIE=tkt_admin_session
    volumes:
      - app_data:/app/.data
    depends_on:
      db:
        condition: service_healthy
    networks:
      - typekit_internal
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # 2. PostgreSQL Database Service
  db:
    image: postgres:16-alpine
    container_name: typekit_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-typekit_db}
      POSTGRES_USER: ${POSTGRES_USER:-typekit_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeMeSecurePassword2026!}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - typekit_internal
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-typekit_admin} -d ${POSTGRES_DB:-typekit_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 3. Nginx Reverse Proxy with SSL Termination & Rate Limiting
  proxy:
    image: nginx:1.25-alpine
    container_name: typekit_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      - typekit_internal
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # 4. Automated Daily PostgreSQL Backup Daemon
  backup:
    image: postgres:16-alpine
    container_name: typekit_backup
    restart: unless-stopped
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-typekit_db}
      PGUSER: ${POSTGRES_USER:-typekit_admin}
      PGPASSWORD: ${POSTGRES_PASSWORD:-ChangeMeSecurePassword2026!}
      BACKUP_KEEP_DAYS: 14
    volumes:
      - backups_data:/backups
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
    networks:
      - typekit_internal
    entrypoint: |
      /bin/sh -c '
        echo "0 2 * * * /usr/local/bin/backup.sh >> /var/log/cron.log 2>&1" > /etc/crontabs/root
        crond -f -l 2
      '
    depends_on:
      db:
        condition: service_healthy

  # 5. Let's Encrypt Certbot SSL Certificate Renewal
  certbot:
    image: certbot/certbot:latest
    container_name: typekit_certbot
    volumes:
      - certbot_www:/var/www/certbot:rw
      - certbot_certs:/etc/letsencrypt:rw
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'"
    networks:
      - typekit_internal

volumes:
  postgres_data:
    name: typekit_postgres_data
  app_data:
    name: typekit_app_data
  certbot_certs:
    name: typekit_certbot_certs
  certbot_www:
    name: typekit_certbot_www
  backups_data:
    name: typekit_backups_data

networks:
  typekit_internal:
    name: typekit_internal_network
    driver: bridge

